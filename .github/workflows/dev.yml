# Staging: same as prod.yml but event type wordpress_publish_dev and branch dev on dispatch.
on:
  push:
    branches:
      - dev
  repository_dispatch:
    types: [wordpress_publish_dev]
  workflow_dispatch:
name: 🚀 Build Dev
concurrency:
  group: gatsby-dev-deploy
  cancel-in-progress: true
jobs:
  web-deploy:
    environment: DEV
    name: 🎉 Deploy to dev
    runs-on: ubuntu-latest
    env:
      CI: true
      WPGRAPHQL_URL: ${{secrets.WPGRAPHQL_URL}}
      GA_TRACKING_ID: ${{secrets.GA_TRACKING_ID}}
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && 'dev' || github.ref }}

      - name: Use Node.js 18
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: 🔨 Build Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ${{ secrets.server }}
          username: ${{ secrets.username }}
          password: ${{ secrets.pass }}
          local-dir: ./public/
